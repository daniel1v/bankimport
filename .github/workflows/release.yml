name: Build Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # Trigger nur bei Tags im Format X.Y.Z

permissions:
  contents: write   # wichtig für Release-Upload
#  packages: write   # falls du Composer-Pakete pushen würdest
#  id-token: write   # für OIDC (z. B. wenn du Secrets nutzt)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup PHP 8
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip

      # 3. Validate the module before packaging
      - name: PHP syntax and CSV regression tests
        run: |
          php -l import.php
          php -l core/class/BankImport.class.php
          php -l core/modules/modBankImport.class.php
          php -l core/modules/BankImportHelper.php
          php tests/BankImportCsvTest.php

      - name: Create installable ZIP
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: php build/package.php "$RELEASE_VERSION"

      # 6. Release mit ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/module_bankimport-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
